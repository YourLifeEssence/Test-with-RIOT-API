<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>League Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="top-section">
            <!-- PROFILE -->
            <div class="profile-block">
                <div class="avatar-container">
                    <img src="https://ddragon.leagueoflegends.com/cdn/13.24.1/img/profileicon/0.png" class="avatar" id="avatar">
                    <span class="level-tag" id="summoner_level">0</span>
                </div>

                <div class="name-block">
                    <h1 class="nickname" id="nickname">John Doe</h1>
                    <span class="tagline" id="tagline">#EUW</span>
                    <span class="region-badge" id="region">EUW</span>
                </div>
            </div>
            <!-- RANK DATA -->
            <div class="rank-block">
                <div class="rank-img-wrapper">
                <img src="https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-iron.png" class="rank-img" id="rank_img">
            </div>
            <div class="rank-info">
                <div class="tier" id="tier">IRON</div>
                <div class="lp" id="lp">0 LP</div>
            </div>
        </div>
    </div>
    <!-- SUMMONER SEARCH -->
    <div class="search-bar">
        <input 
            type="text" 
            class="search-input" 
            placeholder="Enter summoner name..."
            id="name_search"
        >
        <input 
            type="text" 
            class="search-input" 
            placeholder="Enter summoner tag..."
            id="tag_search"
        >
        <button class="search-btn" id="search_btn">Search</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
